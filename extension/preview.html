<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailored Resume Preview - Job Agent AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #toolbar {
      height: 52px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: #f8fafc;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-icon {
      font-size: 18px;
    }
    .badge-text {
      font-size: 14px;
      font-weight: 700;
      color: #818cf8;
    }
    .badge-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn-download {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    .btn-download:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    #viewerFrame {
      width: 100%;
      height: calc(100% - 52px);
      border: none;
      background: #334155;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="badge">
      <span class="badge-icon">🎯</span>
      <div>
        <div class="badge-text" id="docTitle">Tailored Resume Preview</div>
        <div class="badge-sub" id="docMeta">100% ATS-Compliant PDF dynamically compiled for this role</div>
      </div>
    </div>
    <button class="btn-download" id="downloadPdfBtn">📥 Download This PDF</button>
  </div>
  <iframe id="viewerFrame"></iframe>
  <script src="preview.js"></script>
</body>
</html>
